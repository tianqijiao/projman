<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}运维项目管理{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">运维项目管理</a>
      <nav>
        <a href="/">年度看板</a>
        <a href="/projects">项目台账</a>
        <a href="/projects/new">新增项目</a>
        <a href="/settings">设置</a>
      </nav>
      <form method="post" action="/logout">
        <button class="ghost" type="submit">退出</button>
      </form>
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
