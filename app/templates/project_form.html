{% extends "base.html" %}
{% block title %}新增项目 - 运维项目管理{% endblock %}
{% block content %}
<section class="toolbar">
  <div>
    <h1>新增年度项目</h1>
    <p>填入预算金额后自动进入已立项台账。</p>
  </div>
</section>
<section class="panel narrow">
  <form method="post" action="/projects" class="form-grid">
    <label>年度<input name="year" type="number" value="{{ today_year + 1 }}" required></label>
    <label>项目名称<input name="name" required></label>
    <label>预算金额<input name="budget_amount" type="number" step="0.01"></label>
    <label class="wide">备注<textarea name="notes" rows="4"></textarea></label>
    <div class="actions"><button type="submit">保存项目</button></div>
  </form>
</section>
{% endblock %}
